name: Build and push images

on:
  pull_request:
    paths:
      - "modern-democracy/**"
      - ".github/workflows/build-images.yml"
  push:
    branches: [master]
    paths:
      - "modern-democracy/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check and build review
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            modern-democracy/package-lock.json
            modern-democracy/server/package-lock.json

      - name: Check frontend
        working-directory: modern-democracy
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=moderate

      - name: Check API and worker
        working-directory: modern-democracy/server
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=moderate

      - name: Retain ephemeral review bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: democracy-review-${{ github.run_id }}
          path: |
            modern-democracy/dist/
            modern-democracy/server/dist/
          if-no-files-found: error
          retention-days: 3

  build:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: democracy-server
            context: modern-democracy/server
            build_args: ""
          - name: democracy-web
            context: modern-democracy
            build_args: |
              VITE_API_BASE=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          # Production runs on the ARM cluster. Building natively also avoids
          # flaky QEMU/esbuild crashes seen while cross-compiling amd64.
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/radicalgeek/${{ matrix.name }}:latest
            ghcr.io/radicalgeek/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
